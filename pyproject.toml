[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gitignore-auditor"
version = "0.1.0"
description = "Find tracked secrets, build artifacts, and missing ignore rules before they leak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zchstime" }]
keywords = ['gitignore', 'git', 'secrets', 'security', 'developer-tools', 'devsecops']
[project.scripts]
gitignore-audit = "gitignore_auditor.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
